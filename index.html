<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0d2336">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Signal">
  <title>Ennis Studio Signal</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/es-mark-64.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/zodiak-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/switzer-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Lock screen -->
  <main id="lock" class="lock" hidden>
    <form id="lock-form" class="lock__inner" autocomplete="off">
      <img src="assets/icons/es-mark-192.png" alt="" width="72" height="72" class="lock__mark">
      <p class="eyebrow">Ennis Studio</p>
      <h1 class="lock__title">Signal</h1>
      <p class="lock__lede">The day's AI advisory news, curated for your service lines. Swipe through it in a few minutes.</p>
      <label class="field">
        <span class="eyebrow">Passcode</span>
        <input id="pass" type="password" inputmode="text" autocapitalize="none" spellcheck="false" required aria-describedby="lock-error">
      </label>
      <label class="check">
        <input id="remember" type="checkbox" checked>
        <span>Keep this device unlocked</span>
      </label>
      <button class="btn btn--gold" type="submit" id="unlock-btn">Unlock</button>
      <p id="lock-error" class="lock__error" role="alert"></p>
      <p class="lock__fine">The feed is end-to-end encrypted. Only your passcode can unlock it.</p>
    </form>
  </main>

  <!-- Feed -->
  <div id="app" class="app" hidden>
    <header class="topbar">
      <button class="brand" id="to-top" aria-label="Back to first card">
        <img src="assets/icons/es-mark-64.png" alt="" width="22" height="22">
        <span>Signal</span>
      </button>
      <button class="filter-btn" id="filter-btn" aria-haspopup="dialog" aria-controls="sheet">
        <span id="filter-label">All</span>
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </button>
      <span class="counter" id="counter" aria-live="polite"></span>
    </header>

    <div id="feed" class="feed" tabindex="0" aria-label="News cards. Use arrow keys or swipe."></div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <!-- Filter sheet -->
  <div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="sheet__scrim" data-close></div>
    <div class="sheet__panel">
      <div class="sheet__grip" aria-hidden="true"></div>
      <h2 id="sheet-title" class="sheet__title">Show</h2>
      <div id="chips" class="chips"></div>
      <div class="sheet__meta" id="sheet-meta"></div>
      <div class="sheet__actions">
        <button class="btn btn--ghost" id="refresh-btn">Refresh feed</button>
        <button class="btn btn--ghost" id="lock-btn">Lock and forget device</button>
      </div>
    </div>
  </div>

  <!-- Chart lightbox -->
  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Full chart" hidden>
    <button id="lightbox-close" class="lightbox__close" aria-label="Close chart">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div class="lightbox__scroll"><img id="lightbox-img" alt=""></div>
    <p class="lightbox__hint">Pinch to zoom · tap outside to close</p>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
